<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reshape — Migration de données IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="auth.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="wizard.jsx"></script>
<script type="text/babel" src="execution.jsx"></script>
<script type="text/babel" src="pages.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "lang": "en",
  "accent": "indigo",
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const [authed, setAuthed] = React.useState(true);
  const [route, setRoute] = React.useState('dashboard');
  const [notifsOpen, setNotifsOpen] = React.useState(false);
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [sbHidden, setSbHidden] = React.useState(false);
  const [t, setTweak] = window.useTweaks(TWEAKS_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.dataset.theme = t.theme;
    document.documentElement.dataset.accent = t.accent;
    document.documentElement.dataset.density = t.density;
  }, [t.theme, t.accent, t.density]);

  React.useEffect(() => {
    const h = (e) => setRoute(e.detail);
    window.addEventListener('reshape-nav', h);
    return () => window.removeEventListener('reshape-nav', h);
  }, []);

  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setPaletteOpen(o => !o);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  if (!authed) {
    return <window.AuthScreen onLogin={() => setAuthed(true)} />;
  }

  let page;
  if (route === 'dashboard') page = <window.Dashboard navigate={setRoute} />;
  else if (route === 'migrations') page = <window.MigrationWizard navigate={setRoute} />;
  else if (route === 'migrations/run') page = <window.ExecutionMonitor navigate={setRoute} />;
  else if (route === 'history') page = <window.History navigate={setRoute} />;
  else if (route === 'history/detail') page = <window.MigrationDetail navigate={setRoute} />;
  else if (route === 'templates') page = <window.Templates navigate={setRoute} />;
  else if (route === 'connectors') page = <window.Connectors navigate={setRoute} />;
  else if (route === 'credits') page = <window.Credits navigate={setRoute} />;
  else if (route === 'organization') page = <window.Organization navigate={setRoute} />;
  else if (route === 'audit') page = <window.Audit navigate={setRoute} />;
  else if (route === 'webhooks') page = <window.Webhooks navigate={setRoute} />;
  else if (route === 'settings') page = <window.Settings navigate={setRoute} />;
  else page = <window.Dashboard navigate={setRoute} />;

  return (
    <div className={`app-root ${sbHidden ? 'sb-hidden' : ''}`}>
      <window.Sidebar current={route} navigate={setRoute} credits={34280} onAuthLogout={() => setAuthed(false)} />
      <div className="app-main">
        <window.Topbar
          current={route}
          navigate={setRoute}
          theme={t.theme}
          setTheme={v => setTweak('theme', v)}
          lang={t.lang}
          setLang={v => setTweak('lang', v)}
          onOpenNotifs={() => setNotifsOpen(true)}
          onOpenPalette={() => setPaletteOpen(true)}
          sbHidden={sbHidden}
          onToggleSb={() => setSbHidden(v => !v)}
        />
        <window.NotifPanel open={notifsOpen} onClose={() => setNotifsOpen(false)} />
        <window.CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} navigate={setRoute} setTheme={v => setTweak('theme', v)} theme={t.theme} />
        <main className="app-content">{page}</main>
      </div>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Apparence">
          <window.TweakRadio label="Thème" value={t.theme} onChange={v => setTweak('theme', v)} options={[{value:'light',label:'Clair'},{value:'dark',label:'Sombre'}]} />
          <window.TweakRadio label="Langue" value={t.lang} onChange={v => setTweak('lang', v)} options={[{value:'fr',label:'FR'},{value:'en',label:'EN'}]} />
          <window.TweakRadio label="Densité" value={t.density} onChange={v => setTweak('density', v)} options={[{value:'comfortable',label:'Confort'},{value:'compact',label:'Compact'}]} />
        </window.TweakSection>
        <window.TweakSection title="Navigation">
          <window.TweakButton label="Voir auth" onClick={() => setAuthed(false)} />
          <window.TweakButton label="Migration en cours" onClick={() => setRoute('migrations/run')} />
          <window.TweakButton label="Wizard" onClick={() => setRoute('migrations')} />
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
